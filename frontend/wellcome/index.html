<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frontend listo</title>
  <style>
    :root { color-scheme: light; --paper: #f3efe4; --ink: #17211d; --muted: #5e6b65; --accent: #f05a3c; --green: #b7d33d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
    main { position: relative; width: min(900px, 100%); min-height: min(620px, calc(100vh - 48px)); display: grid; align-content: space-between; padding: clamp(30px, 7vw, 76px); border: 2px solid var(--ink); background: radial-gradient(circle at 84% 18%, var(--green) 0 88px, transparent 89px), var(--paper); box-shadow: 12px 12px 0 var(--ink); }
    .topline { display: flex; justify-content: space-between; gap: 20px; font: 700 11px/1 monospace; letter-spacing: .18em; text-transform: uppercase; }
    .status { display: inline-flex; align-items: center; gap: 8px; }
    .status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: pulse 1.8s ease-in-out infinite; }
    h1 { max-width: 720px; margin: 70px 0 30px; font-size: clamp(62px, 13vw, 142px); font-weight: 400; line-height: .76; letter-spacing: -.075em; }
    h1 span { display: block; margin-left: 16%; color: var(--accent); font-style: italic; }
    .bottom { display: flex; align-items: end; justify-content: space-between; gap: 30px; }
    .lead { max-width: 480px; margin: 0; color: var(--muted); font: 16px/1.7 monospace; }
    .port { flex: 0 0 auto; padding: 16px 20px; border: 2px solid var(--ink); background: var(--green); font: 700 14px/1 monospace; transform: rotate(-2deg); }
    @keyframes pulse { 50% { transform: scale(.55); opacity: .5; } }
    @media (max-width: 600px) { main { min-height: calc(100vh - 48px); box-shadow: 7px 7px 0 var(--ink); } .topline, .bottom { align-items: start; flex-direction: column; } h1 span { margin-left: 0; } }
  </style>
</head>
<body>
  <main>
    <div class="topline"><span>FrontEnd / UI</span><span class="status">En línea</span></div>
    <h1>Frontend <span>listo.</span></h1>
    <div class="bottom">
      <p class="lead">La interfaz sigue fingiendo que todo está bajo control.</p>
      <span class="port">wellcome.local.com</span>
    </div>
  </main>
</body>
</html>
