proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=10g inactive=60m use_temp_path=off;

# Backend PHP: backend/wellcome -> http://api.wellcome.local.com
server {
    listen 80;
    server_name api.wellcome.local.com;

    root /var/www/wellcome/public;
    index index.php index.html;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        proxy_cache my_cache;
        proxy_cache_valid 200 302 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 900;
    }
}

# Frontend Node: frontend/wellcome -> http://wellcome.local.com
server {
    listen 80;
    server_name wellcome.local.com;

    location / {
        proxy_pass http://nodejs-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# pgAdmin -> http://pgadmin.local.com
server {
    listen 80;
    server_name pgadmin.local.com;

    location / {
        proxy_pass http://pgadmin:81;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }
}

# Evita que dominios no registrados terminen en alguno de los proyectos.
server {
    listen 80 default_server;
    server_name _;
    return 404;
}

# NUEVOS PROYECTOS
# Backend: clona en /backend/<proyecto>, copia el bloque PHP y cambia únicamente
# server_name y root. Todos los backends usan php-app:9000.
#
# Frontend: clona en /frontend/<proyecto>, inicia su servidor dentro de nodejs-app
# en un puerto libre (8081, 8082, etc.), copia el bloque Node y cambia únicamente
# server_name y el puerto de proxy_pass.
#
# Después registra el dominio en /etc/hosts y ejecuta:
# docker compose exec nginx nginx -t
# docker compose exec nginx nginx -s reload
